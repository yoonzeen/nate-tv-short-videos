<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="%BASE_URL%boot-skeleton.css" />
    <style>
      html,
      body {
        margin: 0;
        background: #050505;
      }

      #root {
        width: 100%;
        min-height: 100svh;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #050505;
        }
      }
    </style>
    <meta
      name="description"
      content="세상의 속도, 네이트 뉴스"
    />
    <meta property="og:title" content="NATE News Story" />
    <meta
      property="og:description"
      content="세상의 속도, 네이트 뉴스"
    />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="NATE News Story" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" href="%BASE_URL%favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />
    <title>NATE News Story</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YET0QJP09F"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-YET0QJP09F');
    </script>
  </head>
  <body>
    <div id="root">
      <main
        class="nf-boot-loading-screen"
        aria-busy="true"
        aria-label="뉴스 불러오는 중"
      >
        <div class="nf-boot-loading-top">
          <div class="nf-boot-brand-row">
            <p class="nf-boot-brand">News Story</p>
          </div>
        </div>

        <div class="nf-boot-loading-bottom" aria-hidden="true">
          <div class="nf-boot-skeleton nf-boot-skeleton-progress"></div>
        </div>

        <div class="nf-boot-loading-overlay">
          <div class="nf-boot-loading-meta">
            <div class="nf-boot-source-row">
              <div class="nf-boot-skeleton nf-boot-skeleton-publisher"></div>
            </div>
            <div class="nf-boot-skeleton nf-boot-skeleton-title"></div>
            <div class="nf-boot-skeleton nf-boot-skeleton-cta"></div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
